name: test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dash
        run: brew install dash
      - name: Test
        run: make test

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dash and curl
        run: sudo apt-get update && sudo apt-get install -y dash curl python3
      - name: Test
        run: make test

  ubuntu-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dash and curl
        run: sudo apt-get update && sudo apt-get install -y dash curl python3
      - name: Build with ASan and UBSan
        run: make debug
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ./tests/run.sh

  ubuntu-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dash, curl, and clang
        run: sudo apt-get update && sudo apt-get install -y dash curl python3 clang
      - name: Test
        run: make test CC=clang
