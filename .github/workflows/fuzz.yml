name: fuzz

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dash and curl
        run: sudo apt-get update && sudo apt-get install -y dash curl
      - name: Ten thousand scripts
        run: make fuzz-nightly
